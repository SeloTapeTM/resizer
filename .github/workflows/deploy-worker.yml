name: Deploy Worker

# Auto-deploys the Cloudflare Worker in worker/ whenever its files change on
# main. Requires a repository secret named CLOUDFLARE_API_TOKEN (and, if your
# account has more than one, CLOUDFLARE_ACCOUNT_ID). See worker/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: worker

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
